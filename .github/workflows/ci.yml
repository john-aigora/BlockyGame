# CI gate (plan 017; hardened in plan 032): lint + build + full Playwright
# suite. The suite once went red on main because feature merges ran only
# their own specs — this workflow makes the full run unskippable. The build
# step exists because Vercel auto-deploys main via `vite build` with a
# downlevel es2019 target only the production build exercises — a bundle-only
# break must fail here, in seconds, not at the deploy.
name: CI

on:
  push:
    branches: [main] # PRs already run below — unscoped push double-ran every PR branch
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite is ~8 min at 3 local workers; CI serializes (workers: 1) with
    # one retry, so give real headroom before the kill (plan 032, DX-6).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
